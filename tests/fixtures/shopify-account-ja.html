<!doctype html>
<!-- 依 Dawn 15.2.0 sections/main-account.liquid 的輸出結構產生（非實際擷取，見 README）。
     注文番号 / 日期 / 狀態 / 合計；沒有商品與配送資訊，那些在詳細頁。 -->
<html lang="ja"><head><title>アカウント</title>
<script src="https://cdn.shopify.com/s/files/1/0001/assets/theme.js"></script>
</head><body>
<div class="customer account">
  <div>
    <h1 class="customer__title">アカウント</h1>
    <a href="/account/logout">ログアウト</a>
  </div>
  <div>
    <div>
      <h2>注文履歴</h2>
      <table role="table" class="order-history">
        <caption class="visually-hidden">注文履歴</caption>
        <thead role="rowgroup">
          <tr role="row">
            <th id="ColumnOrder" scope="col" role="columnheader">注文</th>
            <th id="ColumnDate" scope="col" role="columnheader">日付</th>
            <th id="ColumnPayment" scope="col" role="columnheader">支払い状況</th>
            <th id="ColumnFulfillment" scope="col" role="columnheader">フルフィルメントステータス</th>
            <th id="ColumnTotal" scope="col" role="columnheader">合計</th>
          </tr>
        </thead>
        <tbody role="rowgroup">
          <tr role="row">
            <td id="RowOrder" role="cell" headers="ColumnOrder" data-label="注文">
              <a href="/account/orders/a1b2c3d4e5?key=k1" aria-label="注文番号 #1001">#1001</a>
            </td>
            <td headers="RowOrder ColumnDate" role="cell" data-label="日付"><time datetime="2026-10-01">2026年10月1日</time></td>
            <td headers="RowOrder ColumnPayment" role="cell" data-label="支払い状況">支払い済み</td>
            <td headers="RowOrder ColumnFulfillment" role="cell" data-label="フルフィルメントステータス">発送済み</td>
            <td headers="RowOrder ColumnTotal" role="cell" data-label="合計">¥4,400</td>
          </tr>
          <tr role="row">
            <td id="RowOrder" role="cell" headers="ColumnOrder" data-label="注文">
              <a href="/account/orders/f6g7h8i9j0?key=k2" aria-label="注文番号 #1002">#1002</a>
            </td>
            <td headers="RowOrder ColumnDate" role="cell" data-label="日付"><time datetime="2026-10-05">2026年10月5日</time></td>
            <td headers="RowOrder ColumnPayment" role="cell" data-label="支払い状況">支払い済み</td>
            <td headers="RowOrder ColumnFulfillment" role="cell" data-label="フルフィルメントステータス">未発送</td>
            <td headers="RowOrder ColumnTotal" role="cell" data-label="合計">¥1,980</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body></html>
