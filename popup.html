<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>訂單擷取 <span id="version" class="version"></span></h1>
      <p id="status" class="status">檢查分頁中…</p>
    </header>

    <section id="candidates" class="candidates hidden">
      <div class="candidates-head">
        <label class="select-all"><input type="checkbox" id="selectAll" /> 全選</label>
        <span id="candidateHint" class="hint"></span>
        <button id="toggleOld" class="link hidden"></button>
      </div>
      <div id="candidateList" class="candidate-list"></div>
    </section>

    <button id="scrape" class="primary" disabled>擷取選取的訂單</button>

    <p id="progress" class="progress hidden"></p>

    <section id="result" class="result hidden">
      <div class="actions">
        <button id="saveJson">下載 JSON</button>
      </div>
      <div class="preview" id="preview"></div>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
