<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>訂單擷取 <span id="version" class="version"></span></h1>
      <p id="status" class="status">檢查分頁中…</p>
    </header>

    <p id="progress" class="progress hidden"></p>
    <p id="warning" class="status error hidden"></p>

    <section id="result" class="result hidden">
      <div class="result-head">
        <label class="select-all"><input type="checkbox" id="selectAll" /> 全選</label>
        <span id="summary" class="hint"></span>
      </div>
      <div class="preview" id="preview"></div>
      <button id="saveJson" class="primary" disabled>下載 JSON</button>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
